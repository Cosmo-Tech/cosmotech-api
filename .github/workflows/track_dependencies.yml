name: Track Dependencies

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  dependency_track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '23'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Track dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew cyclonedxBom
      - name: Upload CycloneDX BOM
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/upload-artifact@v7
        with:
          name: cosmotech-api-bom
          path: build/reports/cosmotech-api-bom.xml
          overwrite: true
      - name: Upload cyclonedx bom to dependency (main)
        if: ${{ github.ref_type != 'tag' }}
        uses: DependencyTrack/gh-upload-sbom@v4
        with:
          server-hostname: ${{ secrets.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          api-key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          project: '50a4ad6a-638b-4d7e-9d8e-0310efa85ab9'
          bom-filename: 'build/reports/cosmotech-api-bom.xml'
      - name: Upload cyclonedx bom to dependency (tag)
        if: ${{ github.ref_type == 'tag' }}
        uses: DependencyTrack/gh-upload-sbom@v4
        with:
          server-hostname: ${{ secrets.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          api-key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          project-name: cosmotech-api
          project-version: ${{ github.ref_name }}
          parent: '50a4ad6a-638b-4d7e-9d8e-0310efa85ab9'
          auto-create: true
          bom-filename: 'build/reports/cosmotech-api-bom.xml'
