logging:
  level:
    com.cosmotech: INFO
    http3:
      OkHttpClient: WARN
  pattern:
    # %correlationId is contributed by Micrometer Tracing: [application,traceId,spanId]
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %correlationId%logger{36} - %msg%n"
  include-application-name: true

spring:
  application:
    name: cosmotech-api
  security:
    debug: false
  ai:
    mcp:
      server:
        name: "cosmotech-api-mcp"
        version: "1.0.0"
        protocol: STREAMABLE
  data:
    redis:
      host: ${csm.platform.databases.resources.host}
      port: ${csm.platform.databases.resources.port}
      ssl:
        enabled: ${csm.platform.databases.resources.tls.enabled}
      password: ${csm.platform.databases.resources.password}
      username: ${csm.platform.databases.resources.username}
      timeout: 60000
      client-type: jedis
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  output:
    ansi:
      enabled: ALWAYS
  cloud:
    discovery:
      enabled: false
    kubernetes:
      enabled: false
    aws:
      credentials:
        access-key: ${csm.platform.s3.accessKeyId}
        secret-key: ${csm.platform.s3.secretAccessKey}
      s3:
        # We don't need/have a region for our local S3 service but the AWS SDK requires one to be configured
        region: ${csm.platform.s3.region}
        # Enable path-style / disable DNS-style
        # By default, and for AWS S3, the client crafts its URL with the bucket as sub-domain of the endpoint
        # which is not how our current S3 implementation works as it expects the bucket in the path
        # '<bucket_name>.<endpoint>/<object_key>' DNS vs Path '<endpoint>/<bucket_name>/<object_key>'
        path-style-access-enabled: true
        endpoint: ${csm.platform.s3.endpointUrl}
        checksum-validation-enabled: ${csm.platform.s3.checksumValidationEnabled}
  web:
    error:
      include-stacktrace: never
      whitelabel:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  server:
    port: 8081
  # spring-boot-starter-opentelemetry pulls in micrometer-registry-otlp, which is auto-enabled;
  # metrics keep using the existing Prometheus registry (below), and there is no OTLP metrics
  # receiver configured on the collector side (e.g. Jaeger only ingests traces on :4318), so this
  # must stay disabled independently of OTEL_EXPORT_ENABLED to avoid "404" publish failures.
  otlp:
    metrics:
      export:
        enabled: false
  # Tags added to every span and log resource, for multi-instance drill-down (metrics keep
  # using the existing Prometheus registry and its own management.metrics.tags, untouched here)
  observations:
    key-values:
      deployment.environment.name: "${DEPLOYMENT_ENVIRONMENT:local}"
  metrics:
    tags:
      deployment.environment.name: "${DEPLOYMENT_ENVIRONMENT:local}"
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      slo:
        http.server.requests: "50ms,100ms,250ms,500ms,1s,2s,5s"
  tracing:
    sampling:
      probability: "${OTEL_TRACES_SAMPLER_ARG:1.0}"
    # Nothing is shipped unless OTEL_EXPORT_ENABLED=true; spans/logs are still collected
    # in-process and visible through the actuator endpoints.
    export:
      enabled: "${OTEL_EXPORT_ENABLED:false}"
  logging:
    export:
      otlp:
        enabled: "${OTEL_EXPORT_ENABLED:false}"
  opentelemetry:
    resource-attributes:
      service.namespace: cosmotech
      deployment.environment.name: "${DEPLOYMENT_ENVIRONMENT:local}"
    tracing:
      export:
        otlp:
          endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces"
    logging:
      export:
        otlp:
          endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs"

server:
  jetty:
    accesslog:
      enabled: true

csm:
  platform:
    namespace: "phoenix"
    rbac:
      enabled: true
    api:
      # API Base Path for OpenAPI-generated controllers.
      # Might conflict with the SpringBoot context path, hence leaving it at the root
      base-path: /
      base-url: "http://cosmotech-api-${csm.platform.api.version}:8080"
      version: latest
      mcp:
        dashboard-enabled: false
        enabled: false
        paths-to-exclude:
          - "changeme"
    event-publisher:
      type: in_process
    metrics:
      enabled: true
      retentionDays: 7
      downSamplingDefaultEnabled: false
      downSamplingRetentionDays: 400
      downSamplingBucketDurationMs: 3600000
    databases:
      resources:
        host: "localhost"
        port: "6379"
        username: "default_user"
        password: "default_password"
        tls:
          enabled: false
          bundle: ""
        run:
          defaultPageSize: 200
        runner:
          defaultPageSize: 200
      data:
        host: "localhost"
        port: 5432
        database: "cosmotech"
        reader:
          username: "storage_reader_username"
          password: "storage_reader_password"
        writer:
          username: "storage_writer_username"
          password: "storage_writer_password"
    s3:
      endpointUrl: "http://localhost:9000"
      bucketName: "cosmotech-api"
      accessKeyId: "s3_username"
      secretAccessKey: "s3_password"
      checksumValidationEnabled: false
    argo:
      base-uri: "https://localhost:2746"
      image-pull-secrets: []
      imagePullPolicy: IfNotPresent
      workflows:
        namespace: phoenix
        node-pool-label: ""
        service-account-name: workflow
        storage-class: null
        access-modes:
          # Any in the following list: ReadWriteOnce, ReadOnlyMany, ReadWriteMany, ReadWriteOncePod (K8s 1.22+)
          - ReadWriteOnce
        requests:
          storage: 1Gi
    authorization:
      principal-jwt-claim: "sub"
      tenant-id-jwt-claim: "iss"
      allowed-tenants: []
    upload:
      authorized-mime-types:
        workspaces:
          - application/zip
          - application/xml
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - application/x-tika-ooxml
          - text/csv
          - text/plain
          - text/x-yaml
          - application/json
          - application/vnd.apache.parquet
          - application/x-parquet
        datasets:
          - application/zip
          - application/xml
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - application/x-tika-ooxml
          - text/csv
          - text/plain
          - text/x-yaml
          - application/json
          - application/vnd.apache.parquet
          - application/x-parquet
    containerRegistry:
      scheme: http
      host: localhost:5000
      username: csmenginesdev
      password: "my_registry_password"
    tasks:
      cleanUpArchivedRunners:
        enabled: true
        delay: 300

springdoc:
  ai:
    mcp:
      base-url: ${csm.platform.api.base-url}
      paths-to-exclude: ${csm.platform.api.mcp.paths-to-exclude}
      enabled: ${csm.platform.api.mcp.enabled}
      dashboard-enabled : ${csm.platform.api.mcp.dashboard-enabled}
      guardrails:
        require-approval-for-mutating-tools: ${csm.platform.api.mcp.required-approval:true}
  # See https://springdoc.org/#properties
  api-docs:
    path: /openapi
  packages-to-scan: [""] # Don't load OpenAPI specs from code annotations, we already load the merged file
  pre-loading-enabled: true
  remove-broken-reference-definitions: false
  show-actuator: false
  swagger-ui:
    # Disable the swagger-ui default petstore url
    disable-swagger-default-url: true
    display-request-duration: true
    filter: true
    tags-sorter: alpha
    oauth:
      use-pkce-with-authorization-code-grant: true
    url: /openapi.yaml
  writer-with-default-pretty-printer: true

# Aliases
api:
  base-path: ${csm.platform.api.base-path}
  swagger-ui:
    base-path: ${server.servlet.context-path}
  version: ${csm.platform.api.version}

---
# In dev, compose.yaml starts a Jaeger container and Spring Boot injects its OTLP endpoint,
# so span export can be turned on out of the box. Jaeger only ingests traces: metrics and
# logs stay local (actuator/console).
spring:
  config:
    activate:
      on-profile: "dev"
management:
  tracing:
    export:
      enabled: true

---
# Any profile other than 'dev' (prod, docker, ...) switches to JSON console logs,
# meant to be scraped by log aggregators (ELK, Loki, ...); MDC fields set by
# AccessLogGlobalFilter are automatically included as top-level JSON keys.
spring:
  config:
    activate:
      on-profile: "!dev"
logging:
  structured:
    format:
      console: logstash
